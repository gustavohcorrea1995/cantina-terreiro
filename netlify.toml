# Netlify: a tela fica em public/ e a API é montada a partir do código-fonte antes do deploy.
[build]
  publish = "public"
  command = "npm run montar:netlify"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
